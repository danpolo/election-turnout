name: Smoke test published election dashboard
on:
  push:
    paths:
      - '.github/workflows/verify-site.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public GitHub Pages URL and deployed assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://danpolo.github.io/election-turnout/'
          for path in '' 'index.html' 'app.mjs' 'model.mjs' 'live-mirror.mjs' 'data/turnout.json'; do
            url="$base$path"
            echo "Checking $url"
            code=$(curl -L -sS --max-time 25 --retry 3 --retry-delay 2 \
              -w '%{http_code}' -o /tmp/election-smoke-body "$url")
            echo "HTTP $code, $(wc -c </tmp/election-smoke-body) bytes"
            if [[ "$code" != 200 ]]; then
              echo 'Response body excerpt:'
              head -c 600 /tmp/election-smoke-body || true
              exit 1
            fi
            if [[ "$path" == '' || "$path" == 'index.html' ]]; then
              grep -q 'מפת המנדטים' /tmp/election-smoke-body || { echo 'Wrong HTML served'; exit 1; }
            fi
            if [[ "$path" == 'data/turnout.json' ]]; then
              python3 -c 'import json; j=json.load(open("/tmp/election-smoke-body")); assert j["type"]=="turnout"; assert len(j["localities"])>100; print("Data timestamp",j["timestamp"])'
            fi
          done
          echo 'PASS: Public deployment and five app/data resources verified.'

      - name: Render dashboard in headless Chrome and verify live calculations
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome" || { echo "Headless Chrome not installed on runner"; exit 1; }
          echo "Browser: $chrome"
          timeout 100s "$chrome" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=40000 --dump-dom \
            'https://danpolo.github.io/election-turnout/' \
            > /tmp/election-rendered.html 2> /tmp/election-chrome-stderr || {
              tail -30 /tmp/election-chrome-stderr; exit 1;
            }
          python3 - <<'PY'
          import re, pathlib, html
          d=pathlib.Path('/tmp/election-rendered.html').read_text()
          for label, identifier in [('total','total'),('source','source-state'),('status','status'),('basis','basis')]:
              match=re.search(r'<[^>]+id="'+identifier+r'"[^>]*>(.*?)</',d,re.S)
              print(label+':', html.unescape(re.sub(r'<[^>]+>','',match.group(1) if match else '<missing>'))[:500])
          match=re.search(r'id="total"[^>]*>\s*120\s*/\s*120\s*<',d)
          assert match, "Dashboard did not render a complete 120-seat allocation"
          assert '2022:' in d, "Historical data never loaded"
          print('PASS: Headless browser executed app modules and rendered 120 mandates')
          PY
